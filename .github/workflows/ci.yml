name: Verify Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - release

env:
  MACOSX_DEPLOYMENT_TARGET: "10.15"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-22.04, macos-latest]
        include:
          - os: windows-11-arm
            cmake-args: -A ARM64
    name: Build Server (${{matrix.os}})
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Build Tool
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON -DLSP_STATIC_CRT:BOOL=ON ${{ matrix.cmake-args }}
          cmake --build . --target Luau.LanguageServer.CLI -j 3

      - name: Verify native Windows ARM64 server
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $binary = 'build/Debug/luau-lsp.exe'
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $binary))
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0xAA64) { throw 'The server is not a native ARM64 executable.' }
          & $binary --version
          if ($LASTEXITCODE -ne 0) { throw 'The ARM64 server failed to start.' }

      - name: Upload native Windows ARM64 server
        if: matrix.os == 'windows-11-arm'
        uses: actions/upload-artifact@v4
        with:
          name: luau-lsp-windows-arm64-ci
          path: build/Debug/luau-lsp.exe
          if-no-files-found: error

  run_tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            test-path: ./build/Debug/Luau.LanguageServer.Test
          - os: windows-11-arm
            test-path: ./build/Debug/Luau.LanguageServer.Test
            cmake-args: -A ARM64
          - os: ubuntu-22.04
            test-path: ./build/Luau.LanguageServer.Test
          - os: macos-latest
            test-path: ./build/Luau.LanguageServer.Test

    name: Run Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Build Tests (ASAN)
        if: runner.os != 'Windows'
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON -DLSP_BUILD_ASAN:BOOL=ON
          cmake --build . --target Luau.LanguageServer.Test -j 3

      - name: Build Tests
        if: runner.os == 'Windows'
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON ${{ matrix.cmake-args }}
          cmake --build . --target Luau.LanguageServer.Test -j 3

      - name: Run Tests (Old Solver)
        run: ${{ matrix.test-path }}

      - name: Run Tests (New Solver)
        run: ${{ matrix.test-path }} --new-solver

      - name: Run Tests (All FFlags enabled)
        run: ${{ matrix.test-path }} --fflags=true

  types_smoketest:
    name: Types Smoketest
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Build Tool
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON -DLSP_BUILD_ASAN:BOOL=ON
          cmake --build . --target Luau.LanguageServer.CLI -j 3

      - name: Regenerate Types
        run: |
          cd scripts
          python dumpRobloxTypes.py > globalTypes.d.luau

      - name: Test types
        run: |
          touch test.lua
          build/luau-lsp analyze --defs=scripts/globalTypes.d.luau test.lua

      - name: Test Remodel types
        run: |
          touch remodel_test.lua
          build/luau-lsp analyze --defs=scripts/remodel.d.lua test.lua

  lint_extension:
    name: Lint Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
        working-directory: editors/code
      - name: Run ESLint
        run: npm run lint
        working-directory: editors/code
      - name: Prettier
        run: npm run check:format
        working-directory: editors/code

  build_extension:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest, windows-11-arm]
        include:
          - os: windows-11-arm
            code-args: --target win32-arm64
    name: Test Extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: editors/code
      - run: xvfb-run -a npm test
        working-directory: editors/code
        if: runner.os == 'Linux'
      - run: npm test
        working-directory: editors/code
        if: runner.os != 'Linux'
      - run: npm run prepare-release
        working-directory: editors/code
      - run: npx --no-install vsce package ${{ matrix.code-args }}
        working-directory: editors/code

  selene:
    name: Run selene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ok-nick/setup-aftman@v0.4.2
      - run: selene .

  stylua:
    name: Run stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ok-nick/setup-aftman@v0.4.2
      - run: stylua --check .

  build_plugin:
    name: Verify and Build Roblox Studio Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ok-nick/setup-aftman@v0.4.2

      - name: Generate sourcemap
        run: rojo sourcemap default.project.json --output sourcemap.json
        working-directory: plugin

      - name: Build Tool
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON -DLSP_BUILD_ASAN:BOOL=ON
          cmake --build . --target Luau.LanguageServer.CLI -j 3

      - name: Run Luau Analyze (Plugin Source)
        run: ../build/luau-lsp analyze --sourcemap=sourcemap.json --definitions=../scripts/globalTypes.d.luau src
        working-directory: plugin

      - name: Run Luau Analyze (Cloud Scripts)
        run: |
          lune setup
          echo '{ "aliases": { "lune": "'"$HOME"'/.lune/.typedefs/0.8.9" } }' > .luaurc
          rojo sourcemap test.project.json --output test-sourcemap.json
          ../build/luau-lsp analyze --sourcemap=test-sourcemap.json --definitions=../scripts/globalTypes.d.luau --flag:LuauFixIndexerSubtypingOrdering=True cloud
        working-directory: plugin

      - name: Build Plugin
        run: rojo build plugin --output Luau.rbxm
