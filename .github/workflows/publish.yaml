name: Publish release

on:
  push:
    branches:
      - release

env:
  MACOSX_DEPLOYMENT_TARGET: "10.15"

jobs:
  init:
    name: Initialize release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version and changelog
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

          CHANGELOG=$(awk -v ver="\`$VERSION\`" '
            /^## / {
              if (found) exit
              if ($2 == ver) found=1
              next
            }
            found { print }
          ' CHANGELOG.md | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | sed '/^$/N;/^\n$/d')

          echo "$CHANGELOG" > /tmp/changelog.txt

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: /tmp/changelog.txt

  build:
    name: Build ${{ matrix.artifact-name }}
    needs: [init]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: luau-lsp-win64
            code-targets: win32-x64

          - os: ubuntu-22.04
            artifact-name: luau-lsp-linux-x86_64
            code-targets: linux-x64

          - os: ubuntu-22.04-arm
            artifact-name: luau-lsp-linux-arm64
            code-targets: linux-arm64

          # The macOS server is a universal binary, so it serves both targets.
          - os: macos-latest
            artifact-name: luau-lsp-macos
            code-targets: darwin-arm64 darwin-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build server
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON -DLSP_STATIC_CRT:BOOL=ON
          cmake --build . --config RelWithDebInfo --target Luau.LanguageServer.CLI -j 3

      - name: (macOS) Strip debug symbols
        if: matrix.os == 'macos-latest'
        run: strip -S build/luau-lsp

      - name: (Linux) Strip debug symbols
        if: matrix.os == 'ubuntu-22.04' || matrix.os == 'ubuntu-22.04-arm'
        run: objcopy --strip-debug build/luau-lsp

      - name: Create release archive
        shell: bash
        run: |
          mkdir -p staging dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "build/RelWithDebInfo/luau-lsp.exe" staging/
            cd staging
            7z a ../dist/luau-lsp.zip *
          else
            cp "build/luau-lsp" staging/
            cd staging
            zip ../dist/luau-lsp.zip *
          fi

      # The extension starts the server from bin/, so every VSIX must bundle the binary
      # built for its platform.
      - name: Copy server into extension
        shell: bash
        run: |
          mkdir -p editors/code/bin
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "build/RelWithDebInfo/luau-lsp.exe" editors/code/bin/server.exe
          else
            cp "build/luau-lsp" editors/code/bin/server
            chmod +x editors/code/bin/server
          fi

      - name: Setup Node
        uses: actions/setup-node@v4

      - name: Install extension dependencies
        run: npm ci
        working-directory: editors/code

      - name: Package extension
        shell: bash
        working-directory: editors/code
        run: |
          for target in ${{ matrix.code-targets }}; do
            npx @vscode/vsce package --target "$target" -o "../../dist/luau-lsp-$target.vsix"
          done

      - name: Verify server is bundled
        shell: bash
        run: |
          for target in ${{ matrix.code-targets }}; do
            unzip -l "dist/luau-lsp-$target.vsix" | grep -E "extension/bin/server(\.exe)?$" \
              || { echo "::error::The \"$target\" VSIX does not contain the server binary."; exit 1; }
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            dist/luau-lsp.zip
            dist/*.vsix

  release-github:
    name: Create GitHub release
    needs: [init, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          for dir in artifacts/luau-lsp-*; do
            name=$(basename "$dir")
            cp "$dir/luau-lsp.zip" "release-assets/$name.zip"
            cp "$dir"/*.vsix release-assets/
          done

          # The macOS binary is universal, but rokit ranks assets that name both the OS
          # and the CPU above ones that only name the OS. Without these copies it picks
          # the darwin .vsix files, which it can't extract.
          for arch in arm64 x86_64; do
            cp release-assets/luau-lsp-macos.zip "release-assets/luau-lsp-macos-$arch.zip"
          done

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ needs.init.outputs.tag }}
          git push origin ${{ needs.init.outputs.tag }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ needs.init.outputs.tag }} \
            --title "${{ needs.init.outputs.tag }}" \
            --notes-file artifacts/changelog/changelog.txt \
            release-assets/*
